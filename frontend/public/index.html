<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="ASTRO-ASIX ERP - Enterprise Resource Planning for WoundCare Production & Sales Management" />
    
    <!-- APP VERSION FORCE REFRESH -->
    <meta name="app-version" content="4.0.20251201" />
    
    <!-- Force Cache Refresh -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ASTRO-ASIX" />
    <meta name="application-name" content="ASTRO-ASIX ERP" />
    <meta name="msapplication-TileColor" content="#667eea" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- iOS Safari specific -->
    <meta name="apple-mobile-web-app-orientation" content="portrait" />
    
    <!-- Android Chrome specific -->
    <meta name="mobile-web-app-status-bar-style" content="#667eea" />
    
    <!-- Favicon and App Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Design-system typefaces: Libre Baskerville (headings) + IBM Plex Sans
         (body/UI). Inter kept as a UI fallback. Graceful system fallback offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" />

    <!-- Leaflet (for Geomap module), served from this origin.
         Was loaded from unpkg.com, which made the map depend on a third-party
         CDN being reachable: browser tracking prevention logged
         "blocked access to storage for https://unpkg.com/...", and a hospital
         or office network that filters outbound CDNs would break the map
         entirely. Vendored from node_modules/leaflet@1.9.4 (now a real
         dependency in package.json) into public/vendor/leaflet, so it ships
         with the build and needs no external network. -->
    <link rel="stylesheet" href="%PUBLIC_URL%/vendor/leaflet/leaflet.css" />
    <script defer src="%PUBLIC_URL%/vendor/leaflet/leaflet.js"></script>

    <title>ASTRO-ASIX ERP - Bonnesante Medicals</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
