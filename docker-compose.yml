services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: astroaxis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-natiss_natiss}
      POSTGRES_DB: axis_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axis_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - astroaxis_network

  # FastAPI Backend (serves API + Frontend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astroaxis_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-natiss_natiss}@db:5432/axis_db
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-in-production}
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}

      # Accounting. These were live on the droplet and missing from this file,
      # so deploying it as it stood would have restarted the backend with GL
      # posting silently OFF on a financial system. They belong in version
      # control, not only in whatever the server happens to be running.
      ACCOUNTING_POSTING_ENABLED: ${ACCOUNTING_POSTING_ENABLED:-true}
      ACCOUNTING_CUTOVER_DATE: ${ACCOUNTING_CUTOVER_DATE:-2026-03-01}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Africa/Lagos}

      # Meetings. MEETING_GUEST_SECRET signs the pass a guest's browser holds
      # and is DELIBERATELY not SECRET_KEY: a guest pass must never be usable
      # as a user session. Generated on the server, kept in .env, never in git.
      MEETING_GUEST_SECRET: ${MEETING_GUEST_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://erp.bonnesantemedicals.com}
      # JaaS. Empty until a tenant is bought, and empty is a supported state:
      # meetings then run on the public Jitsi server with server-issued
      # unguessable rooms. All three are required before signing switches on.
      JAAS_APP_ID: ${JAAS_APP_ID:-}
      JAAS_API_KEY: ${JAAS_API_KEY:-}
      JAAS_PRIVATE_KEY: ${JAAS_PRIVATE_KEY:-}

      # The field portal. FIELD_PORTAL_SECRET signs the session a
      # distributor's marketer holds, and like MEETING_GUEST_SECRET it is
      # deliberately a THIRD key. These people work for Penacea and
      # Tripleluminance, not for this company; a token of theirs must not be
      # a valid signature anywhere else in the system. There is no default --
      # the portal returns 503 rather than quietly falling back to SECRET_KEY.
      FIELD_PORTAL_SECRET: ${FIELD_PORTAL_SECRET:-}
      # How long a marketer stays signed in, and how long their recorded
      # positions are kept before the purge deletes them.
      FIELD_SESSION_HOURS: ${FIELD_SESSION_HOURS:-12}
      FIELD_LOCATION_RETENTION_DAYS: ${FIELD_LOCATION_RETENTION_DAYS:-90}

      # Paystack. No default: with no key the payment routes answer 503
      # rather than silently behaving as though payment were configured.
      # Start on the TEST key -- it is available before the business is
      # activated and cannot move real money. PAYSTACK_WEBHOOK_PATH is the
      # unguessable segment in the callback URL given to Paystack, and is a
      # password in the same way the telephony callback URL is.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_WEBHOOK_PATH: ${PAYSTACK_WEBHOOK_PATH:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8004'
      - '8004:8004'
    volumes:
      - ./backend:/app
      - ./frontend/build:/app/frontend/build:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - astroaxis_network

volumes:
  pgdata:
    driver: local

networks:
  astroaxis_network:
    driver: bridge
